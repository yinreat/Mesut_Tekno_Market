<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesut Tekno | Ultimate Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item { transition: 0.3s; cursor: pointer; border-radius: 12px; color: #888; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .active-menu { background: #fff !important; color: #000 !important; font-weight: 700; }
        input { transition: 0.3s; }
        input:focus { border-color: #fff !important; outline: none; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex bg-black">
        <div class="m-auto max-w-sm w-full p-10 glass rounded-[2.5rem] text-center">
            <div class="w-16 h-16 bg-white text-black rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-6 shadow-xl">
                <i class="fa-solid fa-screwdriver-wrench text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold mb-8 tracking-tighter">Mesut Tekno v2.0</h2>
            <button onclick="handleLogin()" class="w-full bg-white text-black p-4 rounded-2xl font-bold hover:scale-105 transition">Kontrol Paneline Gir</button>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <aside class="w-64 border-r border-white/5 p-6 fixed h-full bg-black flex flex-col">
            <div class="font-bold mb-10 flex items-center gap-3 text-lg"><i class="fa-solid fa-box text-white"></i> Mesut Market</div>
            <nav class="space-y-2 flex-1">
                <div onclick="showSection('products')" id="m-products" class="sidebar-item active-menu p-4 text-sm"><i class="fa-solid fa-list mr-3"></i> Envanter</div>
                <div onclick="showSection('newProduct')" id="m-newProduct" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-circle-plus mr-3"></i> Yeni Kayıt</div>
                <div onclick="showSection('scan')" id="m-scan" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-barcode mr-3"></i> Hızlı Tara</div>
                <div onclick="showSection('reports')" id="m-reports" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-chart-line mr-3"></i> Raporlar</div>
            </nav>
        </aside>

        <main class="flex-1 ml-64 p-10">
            <section id="productsSection">
                <h2 class="text-4xl font-bold mb-8">Ürün Yönetimi</h2>
                <div class="glass rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 font-bold uppercase text-[10px] text-gray-500 tracking-widest">
                            <tr>
                                <th class="p-5">Ürün</th><th class="p-5">Barkod</th><th class="p-5">Maliyet</th><th class="p-5">Satış</th><th class="p-5">Kâr</th><th class="p-5">Stok</th><th class="p-5">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="text-sm"></tbody>
                    </table>
                </div>
            </section>

            <section id="newProductSection" class="hidden max-w-2xl">
                <h2 id="formTitle" class="text-4xl font-bold mb-8">Yeni Ürün Ekle</h2>
                <div class="glass p-10 rounded-3xl grid grid-cols-2 gap-6">
                    <input type="hidden" id="editId">
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Ürün İsmi</label>
                        <input type="text" id="pName" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Barkod Numarası</label>
                        <input type="text" id="pBarcode" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Resim Linki</label>
                        <input type="text" id="pImg" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div><label class="text-[10px] text-red-500 font-bold mb-1 block uppercase">Geliş Fiyatı</label>
                        <input type="number" id="pCost" class="w-full p-4 rounded-xl bg-red-500/5 border border-red-500/20 text-red-400"></div>
                    <div><label class="text-[10px] text-green-500 font-bold mb-1 block uppercase">Satış Fiyatı</label>
                        <input type="number" id="pPrice" class="w-full p-4 rounded-xl bg-green-500/5 border border-green-500/20 text-green-400"></div>
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Stok Sayısı</label>
                        <input type="number" id="pStock" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    
                    <button id="saveBtn" onclick="saveProduct()" class="col-span-2 bg-white text-black p-5 rounded-2xl font-bold text-lg hover:bg-gray-200 transition">Kaydet</button>
                    <button id="cancelBtn" onclick="showSection('products')" class="hidden col-span-2 text-gray-500 underline text-sm">İptal Et</button>
                </div>
            </section>

            <section id="scanSection" class="hidden">...</section> 
            <section id="reportsSection" class="hidden">...</section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBwiM_edZ6TY5bgnMZB0D-LM_7lretWvo",
            authDomain: "teknomarket-1.firebaseapp.com",
            projectId: "teknomarket-1",
            storageBucket: "teknomarket-1.firebasestorage.app",
            messagingSenderId: "391354789892",
            appId: "1:391354789892:web:d82f37e93da39d121b0551"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = () => {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            loadProducts();
        };

        // --- ÜRÜN LİSTESİ (DÜZENLE BUTONU EKLENDİ) ---
        window.loadProducts = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = "";
            snap.forEach(res => {
                const item = res.data();
                const id = res.id;
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/[0.02] transition">
                        <td class="p-5 font-bold">${item.name}</td>
                        <td class="p-5 font-mono text-gray-500">${item.barcode}</td>
                        <td class="p-5">₺${item.cost}</td>
                        <td class="p-5">₺${item.price}</td>
                        <td class="p-5 text-green-500">₺${item.price - item.cost}</td>
                        <td class="p-5">${item.stock}</td>
                        <td class="p-5 flex gap-4">
                            <button onclick="editProduct('${id}')" class="text-blue-400 hover:text-blue-300"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteProduct('${id}')" class="text-gray-600 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        };

        // --- DÜZENLEME MODUNA GEÇİŞ ---
        window.editProduct = async (id) => {
            const docRef = doc(db, "inventory", id);
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                const item = docSnap.data();
                document.getElementById('editId').value = id;
                document.getElementById('pName').value = item.name;
                document.getElementById('pBarcode').value = item.barcode;
                document.getElementById('pImg').value = item.img || "";
                document.getElementById('pCost').value = item.cost;
                document.getElementById('pPrice').value = item.price;
                document.getElementById('pStock').value = item.stock;

                document.getElementById('formTitle').innerText = "Ürünü Güncelle";
                document.getElementById('saveBtn').innerText = "Değişiklikleri Kaydet";
                document.getElementById('cancelBtn').classList.remove('hidden');
                showSection('newProduct');
            }
        };

        // --- KAYDET VEYA GÜNCELLE ---
        window.saveProduct = async () => {
            const editId = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('pName').value,
                barcode: document.getElementById('pBarcode').value,
                img: document.getElementById('pImg').value,
                cost: Number(document.getElementById('pCost').value),
                price: Number(document.getElementById('pPrice').value),
                stock: Number(document.getElementById('pStock').value)
            };

            if (editId) {
                // Güncelleme işlemi
                await updateDoc(doc(db, "inventory", editId), data);
                alert("Ürün Güncellendi!");
            } else {
                // Yeni kayıt işlemi
                await addDoc(collection(db, "inventory"), data);
                alert("Yeni Ürün Eklendi!");
            }

            resetForm();
            showSection('products');
            loadProducts();
        };

        function resetForm() {
            document.getElementById('editId').value = "";
            document.getElementById('formTitle').innerText = "Yeni Ürün Tanımla";
            document.getElementById('saveBtn').innerText = "Kaydet";
            document.querySelectorAll('#newProductSection input').forEach(i => i.value = "");
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        window.deleteProduct = async (id) => {
            if(confirm("Emin misin?")) { await deleteDoc(doc(db, "inventory", id)); loadProducts(); }
        };

        window.showSection = (id) => {
            ['productsSection', 'newProductSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + 'Section').classList.remove('hidden');
            if(id !== 'newProduct') resetForm();
        };
    </script>
</body>
</html>
