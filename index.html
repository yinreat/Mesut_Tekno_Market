<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesut Tekno | Profit & Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item { transition: all 0.3s; cursor: pointer; border-radius: 12px; color: #888; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .active-menu { background: #fff !important; color: #000 !important; font-weight: 700; }
        .product-img { width: 45px; height: 45px; object-fit: cover; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex bg-black">
        <div class="m-auto max-w-sm w-full p-10 glass rounded-[2rem] text-center">
            <div class="w-16 h-16 bg-white text-black rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-12">
                <i class="fa-solid fa-store text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold mb-2">Mesut Tekno</h2>
            <p class="text-gray-500 mb-8 text-sm uppercase tracking-widest">Profesyonel Stok & Kâr Takibi</p>
            <button onclick="handleLogin()" class="w-full bg-white text-black p-4 rounded-2xl font-bold hover:scale-105 transition">Yönetim Panelini Aç</button>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <aside class="w-64 border-r border-white/5 p-6 fixed h-full bg-black">
            <div class="font-bold mb-10 flex items-center gap-3 text-xl"><i class="fa-solid fa-layer-group"></i> Panel</div>
            <nav class="space-y-2">
                <div onclick="showSection('products')" id="m-products" class="sidebar-item active-menu p-4 text-sm"><i class="fa-solid fa-boxes-stacked mr-3"></i> Ürünler</div>
                <div onclick="showSection('newProduct')" id="m-newProduct" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-plus-circle mr-3"></i> Yeni Ürün</div>
                <div onclick="showSection('scan')" id="m-scan" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-barcode mr-3"></i> Hızlı Tara</div>
                <div onclick="showSection('reports')" id="m-reports" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-chart-line mr-3"></i> Kâr Analizi</div>
            </nav>
        </aside>

        <main class="flex-1 ml-64 p-10">
            <section id="productsSection">
                <h2 class="text-4xl font-bold mb-8">Stok Durumu</h2>
                <div class="glass rounded-3xl overflow-hidden border border-white/10">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 font-bold uppercase text-[10px] text-gray-500 tracking-wider">
                            <tr>
                                <th class="p-5">Ürün</th><th class="p-5">Barkod</th><th class="p-5">Maliyet</th><th class="p-5">Satış</th><th class="p-5">Kâr</th><th class="p-5">Stok</th><th class="p-5">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="text-sm"></tbody>
                    </table>
                </div>
            </section>

            <section id="newProductSection" class="hidden max-w-2xl">
                <h2 class="text-4xl font-bold mb-8">Yeni Ürün Tanımla</h2>
                <div class="glass p-10 rounded-3xl grid grid-cols-2 gap-6">
                    <div class="col-span-2"><label class="text-xs text-gray-500 mb-2 block font-bold">ÜRÜN ADI</label>
                        <input type="text" id="pName" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div class="col-span-2"><label class="text-xs text-gray-500 mb-2 block font-bold">BARKOD</label>
                        <input type="text" id="pBarcode" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div class="col-span-2"><label class="text-xs text-gray-500 mb-2 block font-bold">GÖRSEL URL</label>
                        <input type="text" id="pImg" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div><label class="text-xs text-green-500 mb-2 block font-bold">GELİŞ FİYATI (Maliyet)</label>
                        <input type="number" id="pCost" class="w-full p-4 rounded-xl bg-green-500/5 border border-green-500/20 text-green-400"></div>
                    <div><label class="text-xs text-blue-500 mb-2 block font-bold">SATIŞ FİYATI</label>
                        <input type="number" id="pPrice" class="w-full p-4 rounded-xl bg-blue-500/5 border border-blue-500/20 text-blue-400"></div>
                    <div class="col-span-2"><label class="text-xs text-gray-500 mb-2 block font-bold">STOK ADEDİ</label>
                        <input type="number" id="pStock" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <button onclick="saveProduct()" class="col-span-2 bg-white text-black p-5 rounded-2xl font-bold text-lg">Kaydet</button>
                </div>
            </section>

            <section id="scanSection" class="hidden text-center max-w-3xl mx-auto">
                <h2 class="text-4xl font-bold mb-10 text-left">Hızlı Sorgu</h2>
                <div class="glass p-12 rounded-[3rem] border-2 border-white/5">
                    <i class="fa-solid fa-barcode text-7xl mb-8 opacity-10"></i>
                    <input type="text" id="scanInput" autofocus class="w-full p-6 rounded-2xl bg-white/5 border-2 border-white/10 text-center text-4xl font-mono focus:border-white transition-all outline-none" placeholder="Okutun..." onkeypress="if(event.key === 'Enter') searchBarcode()">
                </div>
                <div id="scanStatus" class="mt-10"></div>
            </section>

            <section id="reportsSection" class="hidden">
                <h2 class="text-4xl font-bold mb-10">Kâr & Finansal Durum</h2>
                <div class="grid grid-cols-3 gap-8">
                    <div class="glass p-8 rounded-3xl border-l-4 border-blue-500"><p class="text-gray-500 text-xs font-bold mb-2 uppercase">Toplam Satış Değeri</p><p id="totalValue" class="text-4xl font-bold">₺0</p></div>
                    <div class="glass p-8 rounded-3xl border-l-4 border-red-500"><p class="text-gray-500 text-xs font-bold mb-2 uppercase">Toplam Maliyet</p><p id="totalCost" class="text-4xl font-bold">₺0</p></div>
                    <div class="glass p-8 rounded-3xl border-l-4 border-green-500 shadow-[0_0_50px_rgba(34,197,94,0.1)]"><p class="text-green-500 text-xs font-bold mb-2 uppercase">Tahmini Toplam Kâr</p><p id="totalProfit" class="text-5xl font-bold text-green-400">₺0</p></div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBwiM_edZ6TY5bgnMZB0D-LM_7lretWvo",
            authDomain: "teknomarket-1.firebaseapp.com",
            projectId: "teknomarket-1",
            storageBucket: "teknomarket-1.firebasestorage.app",
            messagingSenderId: "391354789892",
            appId: "1:391354789892:web:d82f37e93da39d121b0551"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = () => {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            loadProducts();
            calculateReports();
        };

        window.loadProducts = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = "";
            snap.forEach(res => {
                const item = res.data();
                const id = res.id;
                const profit = Number(item.price) - Number(item.cost);
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/[0.02] transition group">
                        <td class="p-5 flex items-center gap-4"><img src="${item.img || 'https://via.placeholder.com/50'}" class="product-img"> <b>${item.name}</b></td>
                        <td class="p-5 font-mono text-gray-500">${item.barcode}</td>
                        <td class="p-5 text-red-400">₺${item.cost}</td>
                        <td class="p-5 text-blue-400 font-bold">₺${item.price}</td>
                        <td class="p-5 text-green-500 font-bold">₺${profit}</td>
                        <td class="p-5"><span class="bg-white/10 px-3 py-1 rounded-lg">${item.stock}</span></td>
                        <td class="p-5"><button onclick="deleteProduct('${id}')" class="text-gray-600 hover:text-red-500 transition"><i class="fa-solid fa-trash-can"></i></button></td>
                    </tr>`;
            });
        };

        window.saveProduct = async () => {
            const data = {
                name: document.getElementById('pName').value,
                barcode: document.getElementById('pBarcode').value,
                img: document.getElementById('pImg').value,
                cost: Number(document.getElementById('pCost').value),
                price: Number(document.getElementById('pPrice').value),
                stock: Number(document.getElementById('pStock').value)
            };
            await addDoc(collection(db, "inventory"), data);
            alert("Ürün Listeye Alındı!");
            showSection('products');
            loadProducts();
        };

        window.deleteProduct = async (id) => {
            if(confirm("Bu ürünü silmek istediğine emin misin?")) {
                await deleteDoc(doc(db, "inventory", id));
                loadProducts();
                calculateReports();
            }
        };

        window.searchBarcode = async () => {
            const input = document.getElementById('scanInput');
            const q = query(collection(db, "inventory"), where("barcode", "==", input.value));
            const snap = await getDocs(q);
            const status = document.getElementById('scanStatus');
            
            if(!snap.empty) {
                snap.forEach(d => {
                    const item = d.data();
                    status.innerHTML = `
                        <div class="glass p-10 rounded-[2rem] flex items-center gap-10 animate-in zoom-in duration-300 border-2 border-white/10">
                            <img src="${item.img || 'https://via.placeholder.com/150'}" class="w-40 h-40 object-cover rounded-3xl">
                            <div class="text-left">
                                <h3 class="text-4xl font-bold mb-2">${item.name}</h3>
                                <p class="text-5xl font-bold text-white mb-4">₺${item.price}</p>
                                <div class="flex gap-6 text-sm">
                                    <span class="text-green-500 font-bold">Net Kâr: ₺${item.price - item.cost}</span>
                                    <span class="text-gray-500 uppercase">Stok: ${item.stock}</span>
                                </div>
                            </div>
                        </div>`;
                });
            } else { status.innerHTML = `<p class="text-red-500 font-bold">Kayıt Bulunamadı!</p>`; }
            input.value = ""; input.focus();
        };

        window.calculateReports = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            let salesValue = 0, costValue = 0;
            snap.forEach(doc => {
                const d = doc.data();
                salesValue += (Number(d.price) * Number(d.stock));
                costValue += (Number(d.cost) * Number(d.stock));
            });
            document.getElementById('totalValue').innerText = "₺" + salesValue.toLocaleString();
            document.getElementById('totalCost').innerText = "₺" + costValue.toLocaleString();
            document.getElementById('totalProfit').innerText = "₺" + (salesValue - costValue).toLocaleString();
        };

        window.showSection = (id) => {
            ['productsSection', 'newProductSection', 'scanSection', 'reportsSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + 'Section').classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(m => m.classList.remove('active-menu'));
            document.getElementById('m-' + id).classList.add('active-menu');
            if(id === 'scan') setTimeout(() => document.getElementById('scanInput').focus(), 100);
            if(id === 'reports') calculateReports();
        };
    </script>
</body>
</html>
