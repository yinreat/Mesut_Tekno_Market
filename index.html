<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesut Tekno - Stok Yönetim Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .sidebar-item { cursor: pointer; transition: 0.3s; }
        .sidebar-item:hover { background-color: #2d2d2d; color: white; border-radius: 8px; }
        .active-menu { background-color: #ffffff !important; color: #000000 !important; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50">

    <div id="loginPage" class="fixed inset-0 z-50 flex flex-col md:flex-row">
        <div class="md:w-1/2 bg-black text-white flex flex-col justify-center p-12 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
            <div class="mb-8">
                <i class="fa-solid fa-box-archive text-3xl"></i>
                <span class="ml-2 font-bold text-xl uppercase tracking-widest">Mesut Tekno Market</span>
            </div>
            <h1 class="text-5xl font-bold mb-4">Stok kontrolü<br>tek tıkla.</h1>
            <p class="text-gray-400 text-lg">Hızlı arama, stok takibi ve raporlama.</p>
        </div>
        <div class="md:w-1/2 bg-white flex flex-col justify-center p-12">
            <div class="max-w-sm mx-auto w-full">
                <h2 class="text-3xl font-bold mb-8">Hoş geldin.</h2>
                <div class="space-y-4">
                    <input type="text" id="email" class="w-full border p-3 rounded-lg" placeholder="Kullanıcı Adı">
                    <input type="password" id="password" class="w-full border p-3 rounded-lg" placeholder="Şifre">
                    <button onclick="handleLogin()" class="w-full bg-black text-white p-4 rounded-lg font-bold">Giriş Yap</button>
                </div>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <aside class="w-64 bg-black text-gray-400 p-6 flex flex-col fixed h-full">
            <div class="text-white flex items-center mb-10">
                <i class="fa-solid fa-cube text-2xl mr-2"></i>
                <span class="font-bold">Mesut Tekno</span>
            </div>
            <nav class="space-y-2 flex-1">
                <div onclick="showSection('products')" id="m-products" class="sidebar-item active-menu flex items-center p-3 text-sm"><i class="fa-solid fa-list w-6"></i> Ürünler</div>
                <div onclick="showSection('newProduct')" id="m-newProduct" class="sidebar-item flex items-center p-3 text-sm"><i class="fa-solid fa-circle-plus w-6"></i> Yeni Ürün</div>
                <div onclick="showSection('scan')" id="m-scan" class="sidebar-item flex items-center p-3 text-sm"><i class="fa-solid fa-barcode w-6"></i> Hızlı Tara</div>
                <div onclick="showSection('reports')" id="m-reports" class="sidebar-item flex items-center p-3 text-sm"><i class="fa-solid fa-chart-line w-6"></i> Raporlar</div>
            </nav>
            <button onclick="location.reload()" class="text-left p-3 text-sm hover:text-white"><i class="fa-solid fa-right-from-bracket w-6"></i> Çıkış</button>
        </aside>

        <main class="flex-1 ml-64 p-8">
            
            <section id="productsSection">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold">Ürünler</h2>
                    <button onclick="showSection('newProduct')" class="bg-black text-white px-4 py-2 rounded-lg text-sm">+ Yeni Ürün</button>
                </div>
                <div class="bg-white border rounded-xl shadow-sm">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 border-b text-[10px] font-bold uppercase text-gray-500">
                            <tr><th class="p-4">Ürün</th><th class="p-4">Barkod</th><th class="p-4">Fiyat</th><th class="p-4">Stok</th></tr>
                        </thead>
                        <tbody id="productTableBody"></tbody>
                    </table>
                </div>
            </section>

            <section id="newProductSection" class="hidden">
                <h2 class="text-3xl font-bold mb-8">Yeni Ürün Ekle</h2>
                <div class="bg-white p-8 border rounded-xl max-w-xl space-y-4">
                    <input type="text" id="pName" placeholder="Ürün Adı" class="w-full border p-3 rounded-lg">
                    <input type="text" id="pBarcode" placeholder="Barkod" class="w-full border p-3 rounded-lg">
                    <div class="flex gap-4">
                        <input type="number" id="pPrice" placeholder="Fiyat" class="w-full border p-3 rounded-lg">
                        <input type="number" id="pStock" placeholder="Stok" class="w-full border p-3 rounded-lg">
                    </div>
                    <button onclick="saveProduct()" class="bg-black text-white px-8 py-3 rounded-lg font-bold w-full">Kaydet</button>
                </div>
            </section>

            <section id="scanSection" class="hidden">
                <h2 class="text-3xl font-bold mb-6">Barkod Tara</h2>
                <div class="bg-white border rounded-xl p-6">
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="scanInput" class="flex-1 border p-3 rounded-lg" placeholder="Barkod okutun...">
                        <button onclick="searchBarcode()" class="bg-black text-white px-6 py-3 rounded-lg">Ara</button>
                    </div>
                    <div id="scanStatus" class="border-2 border-dashed rounded-xl p-10 text-center text-gray-400">
                        Barkod aranıyor...
                    </div>
                </div>
            </section>

            <section id="reportsSection" class="hidden">
                <h2 class="text-3xl font-bold mb-6">Satış Raporu</h2>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-white p-6 border rounded-xl"><p class="text-xs text-gray-500">TOPLAM CİRO</p><p class="text-2xl font-bold">₺0.00</p></div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBwiM_edZ6TY5bgnMZB0D-LM_7lretWvo",
            authDomain: "teknomarket-1.firebaseapp.com",
            projectId: "teknomarket-1",
            storageBucket: "teknomarket-1.firebasestorage.app",
            messagingSenderId: "391354789892",
            appId: "1:391354789892:web:d82f37e93da39d121b0551",
            measurementId: "G-D4ZVCL9KNN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Giriş
        window.handleLogin = () => {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            loadProducts();
        };

        // Ürünleri Getir
        window.loadProducts = async () => {
            const querySnapshot = await getDocs(collection(db, "inventory"));
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const item = doc.data();
                tbody.innerHTML += `<tr class="border-b text-sm">
                    <td class="p-4 font-bold">${item.name}</td>
                    <td class="p-4 font-mono">${item.barcode}</td>
                    <td class="p-4">₺${item.price}</td>
                    <td class="p-4">${item.stock}</td>
                </tr>`;
            });
        };

        // Ürün Kaydet
        window.saveProduct = async () => {
            const data = {
                name: document.getElementById('pName').value,
                barcode: document.getElementById('pBarcode').value,
                price: document.getElementById('pPrice').value,
                stock: document.getElementById('pStock').value
            };
            await addDoc(collection(db, "inventory"), data);
            alert("Ürün Eklendi!");
            showSection('products');
            loadProducts();
        };

        // Barkod Ara
        window.searchBarcode = async () => {
            const code = document.getElementById('scanInput').value;
            const q = query(collection(db, "inventory"), where("barcode", "==", code));
            const snap = await getDocs(q);
            const status = document.getElementById('scanStatus');
            
            if (!snap.empty) {
                snap.forEach(doc => {
                    const d = doc.data();
                    status.innerHTML = `<div class="text-black font-bold">Ürün: ${d.name} | Stok: ${d.stock} | Fiyat: ₺${d.price}</div>`;
                });
            } else {
                status.innerHTML = `<span class="text-red-500">Ürün Bulunamadı!</span>`;
            }
        };

        // Menü Geçişleri
        window.showSection = (id) => {
            ['productsSection', 'newProductSection', 'scanSection', 'reportsSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + 'Section').classList.remove('hidden');
            
            document.querySelectorAll('.sidebar-item').forEach(m => m.classList.remove('active-menu'));
            document.getElementById('m-' + id).classList.add('active-menu');
        };
    </script>
</body>
</html>
