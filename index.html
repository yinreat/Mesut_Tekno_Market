<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesut Tekno | Professional Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item { transition: all 0.3s; cursor: pointer; border-radius: 12px; color: #888; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .active-menu { background: #fff !important; color: #000 !important; font-weight: 700; }
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex bg-black">
        <div class="m-auto max-w-sm w-full p-8 glass rounded-3xl text-center">
            <i class="fa-solid fa-bolt-lightning text-4xl mb-6"></i>
            <h2 class="text-2xl font-bold mb-8">Mesut Tekno</h2>
            <button onclick="handleLogin()" class="w-full bg-white text-black p-4 rounded-xl font-bold hover:bg-gray-200 transition">Sisteme Giriş Yap</button>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <aside class="w-64 border-r border-white/5 p-6 fixed h-full bg-black">
            <div class="font-bold mb-10 flex items-center gap-2"><i class="fa-solid fa-cube"></i> Mesut Tekno</div>
            <nav class="space-y-2">
                <div onclick="showSection('products')" id="m-products" class="sidebar-item active-menu p-4 text-sm"><i class="fa-solid fa-list mr-2"></i> Ürünler</div>
                <div onclick="showSection('newProduct')" id="m-newProduct" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-plus mr-2"></i> Yeni Ürün</div>
                <div onclick="showSection('scan')" id="m-scan" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-barcode mr-2"></i> Hızlı Tara</div>
                <div onclick="showSection('reports')" id="m-reports" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-chart-pie mr-2"></i> Raporlar</div>
            </nav>
        </aside>

        <main class="flex-1 ml-64 p-10">
            <section id="productsSection">
                <h2 class="text-4xl font-bold mb-8">Ürün Listesi</h2>
                <div class="glass rounded-2xl overflow-hidden text-sm">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 font-bold uppercase text-gray-500">
                            <tr>
                                <th class="p-4">Görsel</th>
                                <th class="p-4">Ürün</th>
                                <th class="p-4">Barkod</th>
                                <th class="p-4">Fiyat</th>
                                <th class="p-4">Stok</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody"></tbody>
                    </table>
                </div>
            </section>

            <section id="newProductSection" class="hidden max-w-xl">
                <h2 class="text-4xl font-bold mb-8">Yeni Kayıt</h2>
                <div class="glass p-8 rounded-2xl space-y-4">
                    <input type="text" id="pName" placeholder="Ürün Adı" class="w-full p-4 rounded-xl bg-white/5 border border-white/10">
                    <input type="text" id="pBarcode" placeholder="Barkod" class="w-full p-4 rounded-xl bg-white/5 border border-white/10">
                    <input type="text" id="pImg" placeholder="Görsel URL (https://...)" class="w-full p-4 rounded-xl bg-white/5 border border-white/10">
                    <div class="flex gap-4">
                        <input type="number" id="pPrice" placeholder="Fiyat" class="w-full p-4 rounded-xl bg-white/5 border border-white/10">
                        <input type="number" id="pStock" placeholder="Stok" class="w-full p-4 rounded-xl bg-white/5 border border-white/10">
                    </div>
                    <button onclick="saveProduct()" class="w-full bg-white text-black p-4 rounded-xl font-bold">Veritabanına Ekle</button>
                </div>
            </section>

            <section id="scanSection" class="hidden">
                <h2 class="text-4xl font-bold mb-8">Barkod Okut</h2>
                <div class="max-w-2xl mx-auto">
                    <div class="glass p-10 rounded-3xl text-center">
                        <i class="fa-solid fa-barcode text-6xl mb-6 opacity-20"></i>
                        <input type="text" id="scanInput" autofocus 
                               class="w-full p-6 rounded-2xl bg-white/5 border-2 border-white/10 text-center text-3xl font-mono focus:border-white outline-none" 
                               placeholder="Barkodu Okutun..." 
                               onkeypress="if(event.key === 'Enter') searchBarcode()">
                        <p class="text-gray-500 mt-4 text-sm italic">Okuyucu otomatik Enter gönderdiğinde arama yapılır.</p>
                    </div>
                    <div id="scanStatus" class="mt-8 transition-all duration-500"></div>
                </div>
            </section>

            <section id="reportsSection" class="hidden">
                <h2 class="text-4xl font-bold mb-8">Raporlar</h2>
                <div class="grid grid-cols-3 gap-6">
                    <div class="glass p-8 rounded-2xl text-center"><p class="text-gray-500 mb-2">TOPLAM ÜRÜN</p><p id="totalProducts" class="text-4xl font-bold">0</p></div>
                    <div class="glass p-8 rounded-2xl text-center"><p class="text-gray-500 mb-2">TOPLAM STOK</p><p id="totalStock" class="text-4xl font-bold">0</p></div>
                    <div class="glass p-8 rounded-2xl text-center"><p class="text-gray-500 mb-2">ENVANTER DEĞERİ</p><p id="totalValue" class="text-4xl font-bold">₺0</p></div>
                </div>
            </section>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBwiM_edZ6TY5bgnMZB0D-LM_7lretWvo",
            authDomain: "teknomarket-1.firebaseapp.com",
            projectId: "teknomarket-1",
            storageBucket: "teknomarket-1.firebasestorage.app",
            messagingSenderId: "391354789892",
            appId: "1:391354789892:web:d82f37e93da39d121b0551"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = () => {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            loadProducts();
            calculateReports();
        };

        window.loadProducts = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = "";
            snap.forEach(doc => {
                const item = doc.data();
                const img = item.img || 'https://via.placeholder.com/50?text=No+Img';
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition">
                        <td class="p-4"><img src="${img}" class="product-img"></td>
                        <td class="p-4 font-bold">${item.name}</td>
                        <td class="p-4 font-mono text-gray-500">${item.barcode}</td>
                        <td class="p-4 text-white">₺${item.price}</td>
                        <td class="p-4"><span class="bg-white/10 px-3 py-1 rounded-full">${item.stock}</span></td>
                    </tr>`;
            });
        };

        window.saveProduct = async () => {
            const name = document.getElementById('pName').value;
            const barcode = document.getElementById('pBarcode').value;
            const img = document.getElementById('pImg').value;
            const price = Number(document.getElementById('pPrice').value);
            const stock = Number(document.getElementById('pStock').value);

            if(!name || !barcode) return alert("İsim ve Barkod zorunlu!");

            await addDoc(collection(db, "inventory"), { name, barcode, img, price, stock });
            alert("Ürün başarıyla kaydedildi!");
            showSection('products');
            loadProducts();
        };

        window.searchBarcode = async () => {
            const input = document.getElementById('scanInput');
            const code = input.value;
            if(!code) return;

            const q = query(collection(db, "inventory"), where("barcode", "==", code));
            const snap = await getDocs(q);
            const status = document.getElementById('scanStatus');
            
            if(!snap.empty) {
                snap.forEach(doc => {
                    const d = doc.data();
                    const img = d.img || 'https://via.placeholder.com/150?text=No+Image';
                    status.innerHTML = `
                        <div class="glass p-8 rounded-3xl flex items-center gap-8 animate-in slide-in-from-bottom duration-500">
                            <img src="${img}" class="w-32 h-32 object-cover rounded-2xl border border-white/10">
                            <div class="text-left">
                                <h3 class="text-3xl font-bold">${d.name}</h3>
                                <p class="text-4xl text-white mt-2 font-light">₺${d.price}</p>
                                <p class="text-gray-500 mt-2 uppercase tracking-widest text-xs">Stok: ${d.stock} Adet</p>
                            </div>
                        </div>`;
                });
            } else {
                status.innerHTML = `<div class="glass p-6 rounded-2xl text-red-400 font-bold">Ürün Bulunamadı!</div>`;
            }
            input.value = ""; // Arama sonrası kutuyu temizle
            input.focus(); // Tekrar okutmaya hazır ol
        };

        window.calculateReports = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            let count = 0, stock = 0, value = 0;
            snap.forEach(doc => {
                const d = doc.data();
                count++;
                stock += Number(d.stock);
                value += (Number(d.price) * Number(d.stock));
            });
            document.getElementById('totalProducts').innerText = count;
            document.getElementById('totalStock').innerText = stock;
            document.getElementById('totalValue').innerText = "₺" + value.toLocaleString();
        };

        window.showSection = (id) => {
            ['productsSection', 'newProductSection', 'scanSection', 'reportsSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + 'Section').classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(m => m.classList.remove('active-menu'));
            document.getElementById('m-' + id).classList.add('active-menu');
            if(id === 'scan') setTimeout(() => document.getElementById('scanInput').focus(), 100);
            if(id === 'reports') calculateReports();
        };
    </script>
</body>
</html>
