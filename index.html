<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesut Tekno | Full Inventory & Profit System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item { transition: 0.3s; cursor: pointer; border-radius: 12px; color: #888; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
        .active-menu { background: #fff !important; color: #000 !important; font-weight: 700; }
        .product-img { width: 45px; height: 45px; object-fit: cover; border-radius: 10px; }
        input { transition: 0.3s; }
        input:focus { border-color: #fff !important; outline: none; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex bg-black">
        <div class="m-auto max-w-sm w-full p-10 glass rounded-[2.5rem] text-center border border-white/5">
            <div class="w-16 h-16 bg-white text-black rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-6">
                <i class="fa-solid fa-store text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold mb-8 tracking-tighter">Mesut Tekno v2.0</h2>
            <button onclick="handleLogin()" class="w-full bg-white text-black p-4 rounded-2xl font-bold hover:scale-105 transition">Yönetim Panelini Aç</button>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <aside class="w-64 border-r border-white/5 p-6 fixed h-full bg-black flex flex-col">
            <div class="font-bold mb-10 flex items-center gap-3 text-lg"><i class="fa-solid fa-cube"></i> Mesut Market</div>
            <nav class="space-y-2 flex-1">
                <div onclick="showSection('products')" id="m-products" class="sidebar-item active-menu p-4 text-sm"><i class="fa-solid fa-list mr-3"></i> Envanter</div>
                <div onclick="showSection('newProduct')" id="m-newProduct" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-circle-plus mr-3"></i> Ürün Ekle/Düzenle</div>
                <div onclick="showSection('scan')" id="m-scan" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-barcode mr-3"></i> Hızlı Tara</div>
                <div onclick="showSection('reports')" id="m-reports" class="sidebar-item p-4 text-sm"><i class="fa-solid fa-chart-line mr-3"></i> Kâr Analizi</div>
            </nav>
            <button onclick="location.reload()" class="text-left p-4 text-xs text-gray-600 hover:text-white transition">Güvenli Çıkış</button>
        </aside>

        <main class="flex-1 ml-64 p-10">
            
            <section id="productsSection">
                <h2 class="text-4xl font-bold mb-8">Stok Yönetimi</h2>
                <div class="glass rounded-3xl overflow-hidden border border-white/10">
                    <table class="w-full text-left">
                        <thead class="bg-white/5 font-bold uppercase text-[10px] text-gray-500 tracking-widest">
                            <tr>
                                <th class="p-5">Ürün</th><th class="p-5">Barkod</th><th class="p-5 text-red-500">Maliyet</th><th class="p-5 text-green-500">Satış</th><th class="p-5">Stok</th><th class="p-5 text-center">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody" class="text-sm"></tbody>
                    </table>
                </div>
            </section>

            <section id="newProductSection" class="hidden max-w-2xl mx-auto">
                <h2 id="formTitle" class="text-4xl font-bold mb-8">Yeni Ürün Ekle</h2>
                <div class="glass p-10 rounded-3xl grid grid-cols-2 gap-6">
                    <input type="hidden" id="editId">
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Ürün İsmi</label>
                        <input type="text" id="pName" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Barkod No</label>
                        <input type="text" id="pBarcode" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Resim URL</label>
                        <input type="text" id="pImg" class="w-full p-4 rounded-xl bg-white/5 border border-white/10" placeholder="https://..."></div>
                    <div><label class="text-[10px] text-red-500 font-bold mb-1 block uppercase">Geliş Fiyatı</label>
                        <input type="number" id="pCost" class="w-full p-4 rounded-xl bg-white/5 border border-red-500/20 text-red-400"></div>
                    <div><label class="text-[10px] text-green-500 font-bold mb-1 block uppercase">Satış Fiyatı</label>
                        <input type="number" id="pPrice" class="w-full p-4 rounded-xl bg-white/5 border border-green-500/20 text-green-400"></div>
                    <div class="col-span-2"><label class="text-[10px] text-gray-500 font-bold mb-1 block uppercase">Stok Adedi</label>
                        <input type="number" id="pStock" class="w-full p-4 rounded-xl bg-white/5 border border-white/10"></div>
                    
                    <button id="saveBtn" onclick="saveProduct()" class="col-span-2 bg-white text-black p-5 rounded-2xl font-bold text-lg hover:bg-gray-200 transition">Kaydet</button>
                    <button id="cancelBtn" onclick="showSection('products')" class="hidden col-span-2 text-gray-500 underline text-sm">Düzenlemeyi İptal Et</button>
                </div>
            </section>

            <section id="scanSection" class="hidden max-w-2xl mx-auto text-center">
                <h2 class="text-4xl font-bold mb-10 text-left">Hızlı Sorgu</h2>
                <div class="glass p-12 rounded-[3rem] border-2 border-white/5">
                    <i class="fa-solid fa-barcode text-7xl mb-8 opacity-10"></i>
                    <input type="text" id="scanInput" autofocus class="w-full p-6 rounded-2xl bg-white/5 border-2 border-white/10 text-center text-4xl font-mono focus:border-white outline-none" placeholder="Okutun..." onkeypress="if(event.key === 'Enter') searchBarcode()">
                    <p class="text-gray-500 mt-4 text-xs italic tracking-widest">OKUYUCU OTOMATİK SORGULAMA YAPAR</p>
                </div>
                <div id="scanStatus" class="mt-10"></div>
            </section>

            <section id="reportsSection" class="hidden">
                <h2 class="text-4xl font-bold mb-10">Kâr Analizi</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
                    <div class="glass p-10 rounded-3xl border-b-4 border-blue-500"><p class="text-gray-500 text-xs font-bold mb-2 uppercase">Toplam Mal Değeri</p><p id="totalValue" class="text-4xl font-bold text-blue-400">₺0</p></div>
                    <div class="glass p-10 rounded-3xl border-b-4 border-red-500"><p class="text-gray-500 text-xs font-bold mb-2 uppercase">Toplam Maliyet</p><p id="totalCost" class="text-4xl font-bold text-red-400">₺0</p></div>
                    <div class="glass p-10 rounded-3xl border-b-4 border-green-500 shadow-2xl"><p class="text-green-500 text-xs font-bold mb-2 uppercase">Beklenen Net Kâr</p><p id="totalProfit" class="text-5xl font-bold text-green-500">₺0</p></div>
                </div>
            </section>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBwiM_edZ6TY5bgnMZB0D-LM_7lretWvo",
            authDomain: "teknomarket-1.firebaseapp.com",
            projectId: "teknomarket-1",
            storageBucket: "teknomarket-1.firebasestorage.app",
            messagingSenderId: "391354789892",
            appId: "1:391354789892:web:d82f37e93da39d121b0551"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.handleLogin = () => {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            loadProducts();
        };

        // --- ÜRÜNLERİ LİSTELE ---
        window.loadProducts = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = "";
            snap.forEach(res => {
                const item = res.data();
                const id = res.id;
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 hover:bg-white/[0.02] transition">
                        <td class="p-5 flex items-center gap-4"><img src="${item.img || 'https://via.placeholder.com/50'}" class="product-img"> <b>${item.name}</b></td>
                        <td class="p-5 font-mono text-gray-500">${item.barcode}</td>
                        <td class="p-5 text-red-400">₺${item.cost}</td>
                        <td class="p-5 text-green-400 font-bold">₺${item.price}</td>
                        <td class="p-5"><span class="bg-white/10 px-3 py-1 rounded-lg">${item.stock}</span></td>
                        <td class="p-5 text-center">
                            <button onclick="editProduct('${id}')" class="text-blue-400 hover:scale-125 mr-4 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteProduct('${id}')" class="text-gray-600 hover:text-red-500 hover:scale-125 transition"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        };

        // --- SİLME İŞLEMİ ---
        window.deleteProduct = async (id) => {
            if(confirm("Bu ürünü silmek istediğine emin misin?")) {
                await deleteDoc(doc(db, "inventory", id));
                loadProducts();
            }
        };

        // --- DÜZENLEME MODU ---
        window.editProduct = async (id) => {
            const docSnap = await getDoc(doc(db, "inventory", id));
            if (docSnap.exists()) {
                const item = docSnap.data();
                document.getElementById('editId').value = id;
                document.getElementById('pName').value = item.name;
                document.getElementById('pBarcode').value = item.barcode;
                document.getElementById('pImg').value = item.img || "";
                document.getElementById('pCost').value = item.cost;
                document.getElementById('pPrice').value = item.price;
                document.getElementById('pStock').value = item.stock;

                document.getElementById('formTitle').innerText = "Ürünü Düzenle";
                document.getElementById('saveBtn').innerText = "Değişiklikleri Güncelle";
                document.getElementById('cancelBtn').classList.remove('hidden');
                showSection('newProduct');
            }
        };

        // --- KAYDET / GÜNCELLE ---
        window.saveProduct = async () => {
            const editId = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('pName').value,
                barcode: document.getElementById('pBarcode').value,
                img: document.getElementById('pImg').value,
                cost: Number(document.getElementById('pCost').value),
                price: Number(document.getElementById('pPrice').value),
                stock: Number(document.getElementById('pStock').value)
            };

            if (editId) {
                await updateDoc(doc(db, "inventory", editId), data);
                alert("Ürün başarıyla güncellendi!");
            } else {
                await addDoc(collection(db, "inventory"), data);
                alert("Ürün başarıyla kaydedildi!");
            }
            resetForm();
            showSection('products');
            loadProducts();
        };

        function resetForm() {
            document.getElementById('editId').value = "";
            document.getElementById('formTitle').innerText = "Yeni Ürün Ekle";
            document.getElementById('saveBtn').innerText = "Kaydet";
            document.getElementById('cancelBtn').classList.add('hidden');
            document.querySelectorAll('#newProductSection input').forEach(i => i.value = "");
        }

        // --- HIZLI TARA (BARKOD SORGUSU) ---
        window.searchBarcode = async () => {
            const input = document.getElementById('scanInput');
            const q = query(collection(db, "inventory"), where("barcode", "==", input.value));
            const snap = await getDocs(q);
            const status = document.getElementById('scanStatus');
            
            if(!snap.empty) {
                snap.forEach(d => {
                    const item = d.data();
                    status.innerHTML = `
                        <div class="glass p-10 rounded-[3rem] flex items-center gap-10 animate-in zoom-in border border-white/10">
                            <img src="${item.img || 'https://via.placeholder.com/150'}" class="w-40 h-40 object-cover rounded-3xl">
                            <div class="text-left">
                                <h3 class="text-4xl font-bold">${item.name}</h3>
                                <p class="text-5xl font-bold text-green-400 mt-2">₺${item.price}</p>
                                <p class="text-gray-500 mt-2 uppercase tracking-widest text-xs font-bold">Stok: ${item.stock} | Kâr: ₺${item.price - item.cost}</p>
                            </div>
                        </div>`;
                });
            } else {
                status.innerHTML = `<div class="glass p-6 rounded-2xl text-red-500 font-bold">Ürün Sistemde Kayıtlı Değil!</div>`;
            }
            input.value = ""; input.focus();
        };

        // --- RAPORLARI HESAPLA ---
        window.calculateReports = async () => {
            const snap = await getDocs(collection(db, "inventory"));
            let salesValue = 0, costValue = 0;
            snap.forEach(doc => {
                const d = doc.data();
                salesValue += (Number(d.price) * Number(d.stock));
                costValue += (Number(d.cost) * Number(d.stock));
            });
            document.getElementById('totalValue').innerText = "₺" + salesValue.toLocaleString();
            document.getElementById('totalCost').innerText = "₺" + costValue.toLocaleString();
            document.getElementById('totalProfit').innerText = "₺" + (salesValue - costValue).toLocaleString();
        };

        // --- MENÜ KONTROL ---
        window.showSection = (id) => {
            ['productsSection', 'newProductSection', 'scanSection', 'reportsSection'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id + 'Section').classList.remove('hidden');
            document.querySelectorAll('.sidebar-item').forEach(m => m.classList.remove('active-menu'));
            document.getElementById('m-' + id).classList.add('active-menu');
            if(id === 'scan') setTimeout(() => document.getElementById('scanInput').focus(), 100);
            if(id === 'reports') calculateReports();
            if(id === 'products') loadProducts();
        };
    </script>
</body>
</html>
