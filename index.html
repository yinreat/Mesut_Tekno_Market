<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesut Tekno | Premium Stock System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        :root { --accent: #ffffff; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0a0a0a; color: #fff; overflow-x: hidden; }
        
        /* Premium Cam Efekti */
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border-radius: 12px; margin-bottom: 4px; color: #888; }
        .sidebar-item:hover { background: rgba(255, 255, 255, 0.05); color: #fff; padding-left: 1.5rem; }
        .active-menu { background: #fff !important; color: #000 !important; font-weight: 700; box-shadow: 0 10px 20px rgba(255,255,255,0.1); }
        
        /* Tarama Animasyonu */
        .scan-line { width: 100%; height: 2px; background: #fff; position: absolute; top: 0; left: 0; animation: scan 2s infinite ease-in-out; box-shadow: 0 0 15px #fff; }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
        
        /* Input Tasarımları */
        input { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: #fff !important; transition: 0.3s; }
        input:focus { border-color: #fff !important; ring: 0 !important; outline: none; background: rgba(255,255,255,0.08) !important; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] flex flex-col md:flex-row bg-black">
        <div class="md:w-3/5 relative overflow-hidden flex flex-col justify-center p-20">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-30"></div>
            <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-white/5 rounded-full blur-[120px]"></div>
            
            <div class="relative z-10">
                <div class="flex items-center gap-3 mb-12">
                    <div class="w-12 h-12 bg-white text-black flex items-center justify-center rounded-xl rotate-12">
                        <i class="fa-solid fa-bolt-lightning text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold tracking-tighter">MESUT TEKNO</span>
                </div>
                <h1 class="text-7xl font-bold tracking-tight leading-[1.1] mb-6">Stok kontrolü<br><span class="text-gray-500">tek tıkla.</span></h1>
                <p class="text-gray-400 text-xl max-w-md font-light">Geleceğin envanter yönetim sistemi şimdi parmaklarınızın ucunda.</p>
            </div>
        </div>
        
        <div class="md:w-2/5 bg-[#0f0f0f] flex flex-col justify-center p-12 border-l border-white/5">
            <div class="max-w-sm mx-auto w-full">
                <h2 class="text-3xl font-bold mb-2">Hoş geldin.</h2>
                <p class="text-gray-500 mb-10 text-sm italic">Devam etmek için giriş yap.</p>
                
                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Kullanıcı Adı</label>
                        <input type="text" id="email" class="w-full p-4 rounded-xl" placeholder="admin">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Şifre</label>
                        <input type="password" id="password" class="w-full p-4 rounded-xl" placeholder="••••••••">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-white text-black p-5 rounded-xl font-bold hover:scale-[1.02] active:scale-[0.98] transition-all">Giriş Yap</button>
                </div>
            </div>
        </div>
    </div>

    <div id="mainDashboard" class="hidden flex min-h-screen">
        <aside class="w-72 bg-black border-r border-white/5 p-8 flex flex-col fixed h-full z-50">
            <div class="flex items-center gap-3 mb-16">
                <div class="w-8 h-8 bg-white text-black flex items-center justify-center rounded-lg">
                    <i class="fa-solid fa-cube text-sm"></i>
                </div>
                <span class="font-bold tracking-tight">Mesut Tekno</span>
            </div>
            
            <nav class="space-y-2 flex-1">
                <div onclick="showSection('products')" id="m-products" class="sidebar-item active-menu flex items-center p-4 text-sm gap-4"><i class="fa-solid fa-grid-2 w-5"></i> Ürünler</div>
                <div onclick="showSection('newProduct')" id="m-newProduct" class="sidebar-item flex items-center p-4 text-sm gap-4"><i class="fa-solid fa-plus-circle w-5"></i> Yeni Ürün</div>
                <div onclick="showSection('scan')" id="m-scan" class="sidebar-item flex items-center p-4 text-sm gap-4"><i class="fa-solid fa-barcode-read w-5"></i> Hızlı Tara</div>
                <div onclick="showSection('reports')" id="m-reports" class="sidebar-item flex items-center p-4 text-sm gap-4"><i class="fa-solid fa-chart-simple w-5"></i> Raporlar</div>
            </nav>

            <button onclick="location.reload()" class="flex items-center gap-4 p-4 text-sm text-gray-500 hover:text-red-400 transition">
                <i class="fa-solid fa-power-off"></i> Güvenli Çıkış
            </button>
        </aside>

        <main class="flex-1 ml-72 p-12">
            
            <section id="productsSection">
                <div class="flex justify-between items-end mb-12">
                    <div>
                        <h4 class="text-gray-500 text-xs font-bold uppercase tracking-[0.2em] mb-2">Genel Bakış</h4>
                        <h2 class="text-5xl font-bold">Ürünler</h2>
                    </div>
                    <button onclick="showSection('newProduct')" class="bg-white/5 hover:bg-white/10 border border-white/10 px-6 py-3 rounded-xl transition text-sm">
                        + Ürün Ekle
                    </button>
                </div>

                <div class="glass rounded-3xl p-4">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-[10px] font-bold text-gray-500 uppercase border-b border-white/5">
                                <th class="p-6">Ürün Detayı</th>
                                <th class="p-6">Barkod No</th>
                                <th class="p-6">Birim Fiyat</th>
                                <th class="p-6">Stok Durumu</th>
                            </tr>
                        </thead>
                        <tbody id="productTableBody">
                            </tbody>
                    </table>
                </div>
            </section>

            <section id="scanSection" class="hidden max-w-4xl">
                <h2 class="text-5xl font-bold mb-12">Hızlı Tara</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="glass rounded-3xl p-8 relative overflow-hidden">
                        <div class="scan-line"></div>
                        <div class="aspect-square bg-black/40 rounded-2xl border border-white/10 flex items-center justify-center mb-6">
                            <i class="fa-solid fa-camera text-4xl text-gray-700 animate-pulse"></i>
                        </div>
                        <input type="text" id="scanInput" class="w-full p-4 rounded-xl text-center text-xl font-mono" placeholder="Barkod Okutun...">
                        <button onclick="searchBarcode()" class="w-full mt-4 bg-white text-black p-4 rounded-xl font-bold">Sorgula</button>
                    </div>
                    <div id="scanStatus" class="glass rounded-3xl p-8 flex flex-col items-center justify-center text-center">
                        <i class="fa-solid fa-box-open text-6xl mb-6 text-white/10"></i>
                        <p class="text-gray-500">Sonuç bekliyor...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script type="module">
        // Firebase Konfigürasyonu (Senin verdiğin bilgiler)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBwiM_edZ6TY5bgnMZB0D-LM_7lretWvo",
            authDomain: "teknomarket-1.firebaseapp.com",
            projectId: "teknomarket-1",
            storageBucket: "teknomarket-1.firebasestorage.app",
            messagingSenderId: "391354789892",
            appId: "1:391354789892:web:d82f37e93da39d121b0551"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Giriş Simülasyonu
        window.handleLogin = () => {
            const btn = event.target;
            btn.innerText = "Bağlanıyor...";
            setTimeout(() => {
                document.getElementById('loginPage').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loginPage').classList.add('hidden');
                    document.getElementById('mainDashboard').classList.remove('hidden');
                    loadProducts();
                }, 500);
            }, 1000);
        };

        // Ürünleri Listeleme (Premium Row Design)
        window.loadProducts = async () => {
            const querySnapshot = await getDocs(collection(db, "inventory"));
            const tbody = document.getElementById('productTableBody');
            tbody.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const item = doc.data();
                tbody.innerHTML += `
                    <tr class="border-b border-white/5 group hover:bg-white/[0.02] transition">
                        <td class="p-6">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-xs">IMG</div>
                                <span class="font-bold">${item.name}</span>
                            </div>
                        </td>
                        <td class="p-6 font-mono text-gray-500">${item.barcode}</td>
                        <td class="p-6 font-bold">₺${item.price}</td>
                        <td class="p-6">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold ${item.stock > 5 ? 'bg-green-500/10 text-green-500' : 'bg-red-500/10 text-red-500'}">
                                ${item.stock} ADET
                            </span>
                        </td>
                    </tr>`;
            });
        };

        // Gelişmiş Arama
        window.searchBarcode = async () => {
            const code = document.getElementById('scanInput').value;
            const status = document.getElementById('scanStatus');
            status.innerHTML = `<div class="animate-spin rounded-full h-8 w-8 border-b-2 border-white"></div>`;
            
            const q = query(collection(db, "inventory"), where("barcode", "==", code));
            const snap = await getDocs(q);
            
            if (!snap.empty) {
                snap.forEach(doc => {
                    const d = doc.data();
                    status.innerHTML = `
                        <div class="w-full animate-in fade-in zoom-in duration-300">
                            <div class="text-xs font-bold text-green-500 uppercase mb-4">Ürün Bulundu</div>
                            <h3 class="text-3xl font-bold mb-2">${d.name}</h3>
                            <p class="text-4xl font-light mb-6">₺${d.price}</p>
                            <div class="flex justify-between text-sm text-gray-500 border-t border-white/10 pt-4">
                                <span>Stok Durumu:</span>
                                <span class="text-white">${d.stock} Adet</span>
                            </div>
                        </div>`;
                });
            } else {
                status.innerHTML = `<i class="fa-solid fa-circle-exclamation text-red-500 text-4xl mb-4"></i><p>Ürün kayıtlı değil.</p>`;
            }
        };

        // Menü Kontrolü
        window.showSection = (id) => {
            ['products', 'newProduct', 'scan', 'reports'].forEach(s => {
                const sec = document.getElementById(s + 'Section');
                if(sec) sec.classList.add('hidden');
                document.getElementById('m-' + s).classList.remove('active-menu');
            });
            document.getElementById(id + 'Section').classList.remove('hidden');
            document.getElementById('m-' + id).classList.add('active-menu');
        };
    </script>
</body>
</html>
